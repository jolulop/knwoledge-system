labels:
  default: unrelated            # every cross-document pair not listed below
  pairs:                        # [claim, claim, label, why] — review provenance above
    # contradiction (7)
    - [A01, B01, contradiction, "rose to 412,000 vs fell to 380,000, same year"]
    - [B01, C01, contradiction, "fell in 2025 vs more travellers in 2025 than 2024"]
    - [A03, B03, contradiction, "finished in March 2025 vs still under way in June 2025"]
    - [A06, B05, contradiction, "harbour master since 2021 vs became harbour master in 2023"]
    - [B06, C05, contradiction, "every 20 minutes vs hourly, both on weekdays"]
    - [B07, C06, contradiction, "charges introduced April 2025 vs free since it opened"]
    - [A09, C09, contradiction, "two hybrid ferries entered service in 2024 vs none entered service in 2024"]
    # apparent_conflict (6): different dates, conditions or scopes
    - [A02, C02, apparent_conflict, "6 euros in 2025 vs 4 euros in 2019"]
    - [B02, C02, apparent_conflict, "6 euros throughout 2025 vs 4 euros in 2019"]
    - [A04, C03, apparent_conflict, "9 m at low tide vs 11 m at high tide"]
    - [B06, C04, apparent_conflict, "every 20 minutes on weekdays vs every 40 minutes on Sundays"]
    - [B10, C10, apparent_conflict, "peak in August 2025 vs peak in July 2024"]
    - [A11, C11, apparent_conflict, "2.1 M in 2025 vs 1.6 M in 2023"]
    # agreement (5)
    - [A01, C01, agreement, "a rise to 412,000 in 2025 is more travellers than 2024"]
    - [A02, B02, agreement, "6 euros in 2025 / stayed at 6 euros throughout 2025"]
    - [A05, B04, agreement, "tonnage fell 3 percent / less cargo than 2024"]
    - [A07, C07, agreement, "opened in September 2025 / opened in autumn 2025"]
    - [A10, B11, agreement, "85 staff / 85 people"]
    # unrelated, listed because they share a topic (2)
    - [A08, B08, unrelated, "lighthouse automation vs cottage museum"]
    - [B09, C08, unrelated, "market location vs trading hours"]
