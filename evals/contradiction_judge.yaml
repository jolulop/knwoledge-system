# Contradiction-judge evaluation fixture (ADR-0069 decision 9, slice 3).
#
# Hand-authored, SYNTHETIC: Brennock and everyone named here are invented. Nothing in this file is
# a real fact. `scripts/eval_contradictions.py` builds a throwaway vault from it in a temporary
# directory (three documents, their claims and quotes, distinct authors so every pair is
# independent) and runs the production estimate -> run path against it. It never touches a real
# vault.
#
# GATES (the evaluator refuses to call a model until both hold):
#   1. `review.labels_reviewed: true`: a human has read every label below and accepts the default
#      ("every cross-document pair not listed is `unrelated`").
#   2. Every threshold is set. Set them BEFORE any model is evaluated.
#
# Labels: contradiction | agreement | apparent_conflict (different dates, conditions or scopes, so
# not a contradiction) | unrelated. Claims are grouped by `topic`. Every cross-document pair within
# a topic MUST be listed under `labels.pairs` (the evaluator checks this). Pairs across topics take
# `labels.default`. So the default is only safe if no two topics contradict each other. Check that
# when reviewing.

version: 1

review:
  labels_reviewed: true
  reviewed_by: "Codex (AI architecture reviewer, authorized by the user)"
  reviewed_at: "2026-11-01"
  notes: >-
    Reviewed all 20 explicit labels and the cross-topic unrelated default at the user's request.
    C09 explicitly denies hybrid or electric ferries entering service in 2024, avoiding the
    diesel-electric ambiguity. No cross-topic contradiction was identified. Thresholds were
    fixed before any live model evaluation: at least 6 of 7 contradictions in every order;
    at most 0 agreement, 1 apparent_conflict and 0 unrelated false positives per order.
    This is a delegated AI review, not an independently completed human annotation exercise.

thresholds:                     # set before any evaluation; the result records them
  min_contradiction_recall: 0.85      # at least 6/7 in the worst permutation
  max_false_positives:                # counts; the worst permutation must stay within each
    agreement: 0
    apparent_conflict: 1
    unrelated: 0

settings:
  # Small on purpose: forces every document into at least two windows, so the run must compare
  # non-corresponding windows (a1 x b2, a2 x b1). The production default is 12,000.
  window_chars: 1200
  # Claim-order permutations: the first is claim-id order, the rest are seeded shuffles.
  permutations: 3

